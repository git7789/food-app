<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodies | Glass Checkout</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        foodies: { yellow: '#F5B301', darkText: '#111827', lightBg: '#F3F4F6' }
                    }
                }
            }
        }
    </script>
    <style>
        /* FAST 3D Food Float Effect */
        .food-image-3d { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateZ(0); }
        .group:hover .food-image-3d { transform: scale(1.12) rotate(-3deg) translateY(-8px); }
        
        /* Optimized Glassmorphism */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 4px 15px 0 rgba(31, 38, 135, 0.05); 
            transform: translateZ(0); 
            will-change: transform;
        }
        .glass-panel-dark { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
            transform: translateZ(0);
        }
        
        /* High-Performance Pure CSS Static Mesh Gradient Background */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(50, 100%, 80%, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 20%, hsla(30, 100%, 85%, 0.6) 0px, transparent 50%),
                radial-gradient(at 20% 100%, hsla(45, 100%, 85%, 0.6) 0px, transparent 50%);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-foodies-lightText font-sans text-foodies-darkText relative">
    
    <div class="mesh-bg"></div>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // --- User Authentication State ---
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('foodies_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authMode, setAuthMode] = useState('login'); // 'login' or 'signup'
            const [authForm, setAuthForm] = useState({ username: '', password: '' });
            const [authError, setAuthError] = useState('');

            // --- Core App State ---
            const [menuItems, setMenuItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [customerName, setCustomerName] = useState("");
            
            const [orderHistory, setOrderHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('foodies_customer_receipts')) || []; } 
                catch (error) { return []; }
            });
            
            const [serverOrders, setServerOrders] = useState([]);
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [showQR, setShowQR] = useState(false);
            const [activeTicket, setActiveTicket] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            
            const [paymentMethod, setPaymentMethod] = useState('ecocash');
            const [phoneNumber, setPhoneNumber] = useState('');
            const [activeCategory, setActiveCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');

            // Auto-fill name if logged in
            useEffect(() => {
                if (currentUser) setCustomerName(currentUser.username);
            }, [currentUser]);

            // Persist guest history
            useEffect(() => { 
                if (!currentUser) localStorage.setItem('foodies_customer_receipts', JSON.stringify(orderHistory)); 
            }, [orderHistory, currentUser]);

            // Sync User History from Server
            useEffect(() => {
                const syncUserHistory = async () => {
                    if (currentUser) {
                        try {
                            const res = await fetch(`/api/user/history/${currentUser.username}`);
                            if (res.ok) {
                                const data = await res.json();
                                // Map backend keys to frontend expectations
                                const formattedHistory = data.history.map(o => ({
                                    id: o.id,
                                    payload: o.qr_payload,
                                    name: o.name,
                                    total: o.total,
                                    date: o.created_at,
                                    items: o.items,
                                    timestamp: o.timestamp
                                }));
                                setOrderHistory(formattedHistory);
                            }
                        } catch (e) { console.error("Failed to sync user history"); }
                    }
                };
                syncUserHistory();
            }, [currentUser, isHistoryOpen]); // Refetch when opening history modal

            // Fetch Live Menu and Server Queue
            useEffect(() => {
                const fetchMenu = async () => {
                    try {
                        const response = await fetch('/api/menu');
                        if (response.ok) {
                            const data = await response.json();
                            setMenuItems(data.menu);
                        }
                    } catch (error) { console.error("Failed to load menu"); }
                };
                fetchMenu();
            }, []);

            useEffect(() => {
                const fetchOrders = async () => {
                    try {
                        const response = await fetch('/api/history');
                        if (response.ok) {
                            const data = await response.json();
                            setServerOrders(data.all_orders);
                        }
                    } catch (error) { console.error("Failed to sync live orders"); }
                };
                fetchOrders();
                const interval = setInterval(fetchOrders, 3000);
                return () => clearInterval(interval);
            }, []);

            // --- Authentication Handlers ---
            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setIsProcessing(true);
                const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/signup';
                
                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(authForm)
                    });
                    const data = await res.json();
                    
                    if (res.ok) {
                        const userData = { username: data.username };
                        setCurrentUser(userData);
                        localStorage.setItem('foodies_user', JSON.stringify(userData));
                        setShowAuthModal(false);
                        setAuthForm({ username: '', password: '' });
                    } else {
                        setAuthError(data.error);
                    }
                } catch (error) {
                    setAuthError('Network error connecting to server.');
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('foodies_user');
                setOrderHistory(JSON.parse(localStorage.getItem('foodies_customer_receipts')) || []);
                setCustomerName("");
            };

            // --- Cart & Checkout Handlers ---
            const addToCart = (item) => {
                if (!item.in_stock) return;
                setCart(prev => {
                    const existing = prev.find(i => i.id === item.id);
                    if (existing) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                    return [...prev, { ...item, quantity: 1 }];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            const handleCheckout = async () => {
                if (paymentMethod === 'ecocash' && phoneNumber.length < 9) {
                    alert("Please enter a valid EcoCash number.");
                    return;
                }
                setIsProcessing(true);
                const finalName = customerName.trim() === "" ? "Guest" : customerName.trim();
                const formattedItems = cart.map(item => `${item.quantity}x ${item.name}`);

                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    const response = await fetch('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            name: finalName, 
                            account_username: currentUser ? currentUser.username : null,
                            items: formattedItems, 
                            total: cartTotal.toFixed(2) 
                        })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        const newTicket = { 
                            id: data.order_id, 
                            payload: data.qr_payload, 
                            name: finalName, 
                            total: cartTotal.toFixed(2), 
                            date: new Date().toLocaleDateString(),
                            items: formattedItems,
                            timestamp: Date.now() 
                        };
                        
                        setOrderHistory(prev => [newTicket, ...prev]);
                        setActiveTicket(newTicket);
                        setShowQR(true);
                        setCart([]);
                        setIsCartOpen(false);
                    } else { alert("Error: " + data.error); }
                } catch (error) { alert("Could not connect to the server."); } 
                finally { setIsProcessing(false); }
            };

            const scrollToMenu = () => {
                document.getElementById('menu-section').scrollIntoView({ behavior: 'smooth' });
                setIsMobileMenuOpen(false);
            };

            const categories = ['All', ...new Set(menuItems.map(item => item.category))];
            const displayedItems = menuItems.filter(item => {
                return (activeCategory === 'All' || item.category === activeCategory) && item.name.toLowerCase().includes(searchQuery.toLowerCase());
            });

            // Smart Status Tracking
            const getTicketStatus = (ticket) => {
                if (!ticket) return 'waiting';
                const liveOrder = serverOrders.find(o => String(o.id) === String(ticket.id));
                if (liveOrder) return liveOrder.status; 
                if (Date.now() - ticket.timestamp < 10000) return 'waiting';
                return 'collected';
            };

            const activeStatus = getTicketStatus(activeTicket);

            const getCategoryIcon = (cat) => {
                const lower = cat.toLowerCase();
                if (lower.includes('burger')) return 'fa-hamburger';
                if (lower.includes('pizza')) return 'fa-pizza-slice';
                if (lower.includes('drink')) return 'fa-coffee';
                if (lower.includes('wrap') || lower.includes('side')) return 'fa-hotdog';
                if (lower === 'all') return 'fa-utensils';
                return 'fa-concierge-bell';
            };

            const deleteReceipt = (e, ticket) => {
                e.stopPropagation();
                if (getTicketStatus(ticket) !== 'collected' && getTicketStatus(ticket) !== 'completed') {
                    alert("This ticket is still active! You can only delete tickets after they have been collected at dispatch.");
                    return;
                }
                if (window.confirm('Delete this collected receipt?')) {
                    setOrderHistory(prev => prev.filter(t => t.id !== ticket.id));
                }
            };

            const clearAllReceipts = () => {
                const activeTickets = orderHistory.filter(t => getTicketStatus(t) !== 'collected' && getTicketStatus(t) !== 'completed');
                if (activeTickets.length === orderHistory.length) {
                    alert("All your tickets are currently active! They cannot be deleted until collected.");
                    return;
                }
                if (window.confirm('Clear all collected receipts? (Your active tickets will be kept safely)')) {
                    setOrderHistory(activeTickets);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative z-10">
                    
                    <nav className="sticky top-4 z-[55] flex items-center justify-between glass-panel rounded-full px-6 md:px-10 py-3 mx-4 md:mx-6">
                        <div className="flex items-center space-x-2">
                            <div className="w-10 h-10 rounded-full bg-foodies-yellow flex items-center justify-center shadow-lg">
                                <span className="font-black text-black text-lg">F</span>
                            </div>
                            <span className="font-serif font-black text-2xl tracking-tight text-black hidden sm:block">Foodies.</span>
                        </div>
                        
                        <div className="hidden md:flex space-x-6 text-sm font-bold text-gray-800">
                            <button onClick={scrollToMenu} className="hover:text-foodies-yellow transition">Menu</button>
                            <a href="#about" className="hover:text-foodies-yellow transition">About</a>
                            <a href="#contact" className="hover:text-foodies-yellow transition">Contact</a>
                        </div>

                        <div className="flex items-center space-x-3">
                            {/* Desktop Account Button */}
                            <div className="hidden sm:flex items-center">
                                {currentUser ? (
                                    <div className="flex items-center space-x-3 glass-panel rounded-full px-4 py-2 border border-white">
                                        <span className="font-bold text-xs text-gray-800">Hi, {currentUser.username}</span>
                                        <button onClick={handleLogout} className="text-red-500 hover:text-red-700 transition text-xs font-black uppercase"><i className="fas fa-sign-out-alt"></i></button>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowAuthModal(true)} className="glass-panel rounded-full px-5 py-2 font-black text-xs text-gray-800 hover:bg-white/80 transition uppercase tracking-wider">
                                        Sign In
                                    </button>
                                )}
                            </div>

                            <button onClick={() => setIsHistoryOpen(true)} className="relative w-10 h-10 md:w-12 md:h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/80 transition hidden sm:flex">
                                <i className="fas fa-receipt text-lg md:text-xl text-gray-800"></i>
                                {orderHistory.length > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white/50 shadow-sm">{orderHistory.length}</span>}
                            </button>
                            <button onClick={() => setIsCartOpen(true)} className="relative w-10 h-10 md:w-12 md:h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/80 transition">
                                <i className="fas fa-shopping-bag text-lg md:text-xl text-gray-800"></i>
                                {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-foodies-yellow text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white/50 shadow-sm">{cartCount}</span>}
                            </button>
                            
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden relative w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-white/80 transition">
                                <i className={`fas ${isMobileMenuOpen ? 'fa-times' : 'fa-bars'} text-lg text-gray-800`}></i>
                            </button>
                        </div>
                    </nav>

                    <div className={`md:hidden fixed top-24 left-4 right-4 glass-panel !bg-white/90 rounded-3xl z-[60] overflow-hidden transition-all duration-300 origin-top ${isMobileMenuOpen ? 'scale-y-100 opacity-100' : 'scale-y-0 opacity-0 pointer-events-none'}`}>
                        <div className="flex flex-col p-3 space-y-2">
                            {currentUser ? (
                                <div className="text-left font-black text-xl text-black p-4 bg-foodies-yellow/20 rounded-2xl flex items-center justify-between">
                                    <span>Hi, {currentUser.username}</span>
                                    <button onClick={handleLogout} className="bg-white px-3 py-1 rounded-full text-xs text-red-500 uppercase tracking-widest shadow-sm">Logout</button>
                                </div>
                            ) : (
                                <button onClick={() => { setShowAuthModal(true); setIsMobileMenuOpen(false); }} className="text-left font-black text-xl text-black p-4 bg-foodies-yellow/20 rounded-2xl flex items-center justify-between">
                                    <span>Sign In / Register</span>
                                    <i className="fas fa-user-circle text-foodies-yellow"></i>
                                </button>
                            )}
                            <button onClick={scrollToMenu} className="text-left font-black text-xl text-black p-4 bg-white/50 hover:bg-white/80 rounded-2xl transition flex items-center justify-between">
                                <span>Order Menu</span>
                                <i className="fas fa-chevron-right text-gray-400"></i>
                            </button>
                            <button onClick={() => { setIsHistoryOpen(true); setIsMobileMenuOpen(false); }} className="text-left font-black text-xl text-black p-4 bg-white/50 hover:bg-white/80 rounded-2xl transition flex items-center justify-between">
                                <span>Track Orders</span>
                                {orderHistory.length > 0 && <span className="bg-black text-white text-xs px-2 py-1 rounded-full">{orderHistory.length}</span>}
                            </button>
                        </div>
                    </div>

                    <div className="px-4 mt-8">
                        <div className="glass-panel rounded-[3rem] p-10 md:p-16 text-center relative overflow-hidden group">
                            <div className="relative z-10">
                                <h1 className="font-serif text-5xl md:text-7xl text-black leading-[1.1] mb-6 tracking-tight font-black">
                                    Mobile Order.<br/>Instant <span className="text-foodies-yellow drop-shadow-md">Assembly.</span>
                                </h1>
                                <p className="text-gray-700 text-sm md:text-base font-bold max-w-md mx-auto mb-8">
                                    Order from your phone. Scan your token at the counter. Food assembled instantly.
                                </p>
                                <button onClick={scrollToMenu} className="bg-black text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-gray-800 transition shadow-xl hover:-translate-y-1 inline-flex items-center space-x-3">
                                    <span>Explore Menu</span>
                                    <i className="fas fa-arrow-right text-foodies-yellow"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <main id="menu-section" className="flex-grow max-w-6xl mx-auto px-4 py-12 w-full">
                        
                        <div className="mb-12">
                            <div className="glass-panel rounded-full px-6 py-4 flex items-center mb-8 max-w-xl mx-auto">
                                <i className="fas fa-search text-gray-500 mr-4 text-xl"></i>
                                <input 
                                    type="text" 
                                    placeholder="Search the menu..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-transparent border-none focus:outline-none text-black font-bold placeholder-gray-500 text-lg"
                                />
                            </div>

                            <div className="flex overflow-x-auto hide-scrollbar gap-4 pb-4 items-center px-2">
                                {categories.map((cat, index) => {
                                    const isActive = activeCategory === cat;
                                    return (
                                        <button key={index} onClick={() => setActiveCategory(cat)} className="flex flex-col items-center space-y-3 group shrink-0 min-w-[80px]">
                                            <div className={`w-16 h-16 rounded-[1.5rem] flex items-center justify-center transition-all duration-300 ${isActive ? 'bg-foodies-yellow shadow-lg scale-110 border border-yellow-400' : 'glass-panel text-gray-700 group-hover:bg-white/80'}`}>
                                                <i className={`fas ${getCategoryIcon(cat)} text-2xl ${isActive ? 'text-black' : ''}`}></i>
                                            </div>
                                            <span className={`text-sm tracking-wide transition-colors ${isActive ? 'font-black text-black' : 'font-bold text-gray-600 group-hover:text-black'}`}>{cat}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {displayedItems.length === 0 ? (
                            <div className="text-center py-20 text-gray-600 font-bold text-xl glass-panel rounded-[2rem]">No items found in this category.</div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                                {displayedItems.map(item => (
                                    <div key={item.id} className={`glass-panel p-5 md:p-6 rounded-[2rem] flex flex-col relative group transition duration-500 ${!item.in_stock ? 'opacity-60' : 'hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(0,0,0,0.1)] hover:bg-white/80'}`}>
                                        
                                        {!item.in_stock && <div className="absolute top-4 left-4 bg-red-500 text-white text-[10px] font-black px-3 py-1.5 rounded-full z-20 shadow-md">OUT</div>}
                                        
                                        <div className="w-full h-32 md:h-40 mb-6 flex items-center justify-center relative">
                                            <div className="absolute w-24 h-24 bg-white/50 rounded-full blur-xl z-0 transition-opacity duration-300 opacity-0 group-hover:opacity-100"></div>
                                            <img src={item.image} alt={item.name} className={`h-full w-auto object-contain relative z-10 ${item.in_stock ? 'food-image-3d' : ''}`} />
                                        </div>
                                        
                                        <div className="text-center mb-6">
                                            <h4 className="font-black text-base md:text-xl text-black leading-tight mb-2 line-clamp-1">{item.name}</h4>
                                            <p className="text-gray-700 text-xs md:text-sm font-bold leading-snug line-clamp-2">{item.description}</p>
                                        </div>
                                        
                                        <div className="mt-auto pt-4 flex justify-between items-center border-t border-gray-200/50">
                                            <p className="font-black text-xl md:text-2xl text-black">${item.price.toFixed(2)}</p>
                                            <button 
                                                onClick={() => addToCart(item)} 
                                                disabled={!item.in_stock}
                                                className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition-all duration-300 shadow-md shrink-0 ${!item.in_stock ? 'bg-gray-300 text-gray-500 cursor-not-allowed border-none' : 'bg-black text-white hover:bg-foodies-yellow hover:text-black hover:scale-110'}`}
                                            >
                                                <i className="fas fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <footer id="about" className="glass-panel border-t border-white/50 pt-16 pb-8 mt-12 shrink-0 relative z-10 w-full">
                        <div className="max-w-6xl mx-auto px-6 border-t border-gray-200/50 pt-8 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
                            <p className="text-gray-600 font-bold text-xs">© 2026 Foodies. All rights reserved.</p>
                            <div className="flex items-center space-x-3 text-gray-700 font-bold text-[10px] tracking-[0.25em] uppercase glass-panel px-4 py-2 rounded-full border border-white/80">
                                <p>System Developed by Bowen</p>
                            </div>
                        </div>
                    </footer>

                    {/* Glass Modals - AUTHENTICATION */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm !bg-white/95 rounded-[2rem] p-8 shadow-2xl relative animate-[slideIn_0.3s_ease-out]">
                                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 text-gray-600">
                                    <i className="fas fa-times"></i>
                                </button>
                                
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 rounded-full bg-foodies-yellow mx-auto flex items-center justify-center shadow-lg mb-4">
                                        <i className="fas fa-user text-2xl text-black"></i>
                                    </div>
                                    <h2 className="text-2xl font-serif font-black text-black">{authMode === 'login' ? 'Welcome Back' : 'Create Account'}</h2>
                                    <p className="text-sm font-bold text-gray-500 mt-1">{authMode === 'login' ? 'Sign in to track your orders' : 'Join Foodies today'}</p>
                                </div>

                                {authError && (
                                    <div className="bg-red-100 text-red-600 text-xs font-bold p-3 rounded-xl mb-4 text-center border border-red-200">
                                        {authError}
                                    </div>
                                )}

                                <form onSubmit={handleAuth} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1 uppercase tracking-wider">Username</label>
                                        <input type="text" required value={authForm.username} onChange={e => setAuthForm({...authForm, username: e.target.value})} className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:border-black focus:outline-none transition font-bold text-black" placeholder="Choose a username" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1 uppercase tracking-wider">Password</label>
                                        <input type="password" required value={authForm.password} onChange={e => setAuthForm({...authForm, password: e.target.value})} className="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:border-black focus:outline-none transition font-bold text-black" placeholder="Enter password" />
                                    </div>
                                    
                                    <button type="submit" disabled={isProcessing} className="w-full bg-black text-white font-black py-4 rounded-xl shadow-lg hover:bg-gray-800 transition disabled:opacity-50 mt-2">
                                        {isProcessing ? <i className="fas fa-circle-notch fa-spin"></i> : (authMode === 'login' ? 'Sign In' : 'Sign Up')}
                                    </button>
                                </form>

                                <div className="text-center mt-6">
                                    <button onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); }} className="text-xs font-bold text-gray-500 hover:text-black transition underline">
                                        {authMode === 'login' ? "Don't have an account? Sign up" : "Already have an account? Sign in"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Glass Modals - CART */}
                    {isCartOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[70] flex justify-end">
                            <div className="glass-panel w-full max-w-md h-full flex flex-col !bg-white/90 border-l border-white shadow-2xl animate-[slideIn_0.3s_ease-out]">
                                <div className="p-6 border-b border-gray-200/50 flex justify-between items-center">
                                    <h2 className="text-3xl font-black font-serif text-black">Your Bag</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition text-black">
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-6 hide-scrollbar space-y-6">
                                    {cart.length === 0 ? (
                                        <div className="text-center text-gray-500 mt-32">
                                            <i className="fas fa-shopping-bag text-6xl mb-6 opacity-30 text-black"></i>
                                            <p className="text-lg font-bold">Your bag is empty.</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="glass-panel !bg-white/60 rounded-3xl p-2 border border-white">
                                                {cart.map(item => (
                                                    <div key={item.id} className="flex justify-between items-center p-4 border-b border-gray-100 last:border-0">
                                                        <div>
                                                            <p className="font-bold text-black text-lg">{item.name}</p>
                                                            <p className="text-gray-700 font-bold">${item.price.toFixed(2)} x {item.quantity}</p>
                                                        </div>
                                                        <div className="flex items-center space-x-4">
                                                            <p className="font-black text-xl text-black">${(item.price * item.quantity).toFixed(2)}</p>
                                                            <button onClick={() => removeFromCart(item.id)} className="w-8 h-8 rounded-full bg-red-100 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition shadow-sm">
                                                                <i className="fas fa-minus text-sm"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="glass-panel !bg-white/60 rounded-3xl p-6 space-y-5 border border-white">
                                                <div>
                                                    <label className="block text-sm font-bold text-gray-800 mb-2">Name on Order {currentUser && <span className="text-xs bg-foodies-yellow px-2 py-0.5 rounded-full ml-2">Account</span>}</label>
                                                    <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Guest" className="w-full bg-white border border-gray-200 p-4 rounded-xl focus:border-black focus:outline-none transition font-bold text-black shadow-sm" />
                                                </div>

                                                <div className="flex space-x-3">
                                                    <button onClick={() => setPaymentMethod('ecocash')} className={`flex-1 py-4 rounded-xl font-bold transition shadow-sm border ${paymentMethod === 'ecocash' ? 'bg-foodies-yellow text-black border-foodies-yellow' : 'bg-white text-gray-500 border-gray-200'}`}>EcoCash</button>
                                                    <button onClick={() => setPaymentMethod('card')} className={`flex-1 py-4 rounded-xl font-bold transition shadow-sm border ${paymentMethod === 'card' ? 'bg-black text-white border-black' : 'bg-white text-gray-500 border-gray-200'}`}>Bank Card</button>
                                                </div>

                                                {paymentMethod === 'ecocash' && (
                                                    <div className="bg-white/80 border border-gray-200 rounded-xl p-4 shadow-sm">
                                                        <label className="block text-xs font-bold text-gray-600 mb-2">MOBILE NUMBER</label>
                                                        <div className="flex items-center bg-white rounded-lg overflow-hidden border border-gray-200">
                                                            <div className="bg-gray-50 px-4 py-3 font-bold text-gray-500 border-r border-gray-200">+263</div>
                                                            <input type="tel" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} placeholder="77X XXX XXX" className="w-full p-3 focus:outline-none font-bold text-black" />
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </>
                                    )}
                                </div>
                                
                                {cart.length > 0 && (
                                    <div className="p-6 border-t border-gray-200/50 bg-white/80">
                                        <div className="flex justify-between items-center mb-6">
                                            <p className="font-bold text-gray-700 text-lg">Total</p>
                                            <p className="font-black text-4xl text-black">${cartTotal.toFixed(2)}</p>
                                        </div>
                                        <button onClick={handleCheckout} disabled={isProcessing} className="w-full bg-black text-white font-black text-xl p-5 rounded-2xl shadow-xl hover:bg-gray-800 transition flex justify-center items-center space-x-3 disabled:opacity-50">
                                            {isProcessing ? <i className="fas fa-circle-notch fa-spin"></i> : <i className="fas fa-lock"></i>}
                                            <span>{isProcessing ? 'Processing...' : 'Place Secure Order'}</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Glass Modals - HISTORY */}
                    {isHistoryOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[70] flex justify-end">
                            <div className="glass-panel w-full max-w-md h-full flex flex-col !bg-white/90 border-l border-white shadow-2xl animate-[slideIn_0.3s_ease-out]">
                                <div className="p-6 border-b border-gray-200/50 flex justify-between items-center">
                                    <h2 className="text-3xl font-black font-serif text-black">{currentUser ? 'My Receipts' : 'Receipts'}</h2>
                                    <div className="flex space-x-3">
                                        {orderHistory.some(t => getTicketStatus(t) === 'collected' || getTicketStatus(t) === 'completed') && (
                                            <button onClick={clearAllReceipts} className="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center hover:bg-red-500 hover:text-white transition text-red-500 shadow-sm" title="Clear Completed Tickets">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                        )}
                                        <button onClick={() => setIsHistoryOpen(false)} className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition text-black shadow-sm">
                                            <i className="fas fa-times text-xl"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                {!currentUser && (
                                    <div className="mx-6 mt-6 bg-foodies-yellow/20 p-4 rounded-xl text-sm font-bold text-gray-700 flex items-center space-x-3 border border-yellow-200">
                                        <i className="fas fa-info-circle text-foodies-yellow text-xl"></i>
                                        <p>You are checking out as a Guest. <button onClick={() => { setIsHistoryOpen(false); setShowAuthModal(true); }} className="underline text-black">Sign in</button> to save your receipts permanently!</p>
                                    </div>
                                )}

                                <div className="flex-1 overflow-y-auto p-6 hide-scrollbar space-y-4">
                                    {orderHistory.length === 0 ? (
                                        <div className="text-center text-gray-500 mt-20">
                                            <i className="fas fa-receipt text-6xl mb-6 opacity-30 text-black"></i>
                                            <p className="text-lg font-bold">No recent orders.</p>
                                        </div>
                                    ) : (
                                        orderHistory.map((ticket, idx) => {
                                            const status = getTicketStatus(ticket);
                                            const isDone = status === 'collected' || status === 'completed';
                                            return (
                                            <div key={idx} onClick={() => { setActiveTicket(ticket); setShowQR(true); setIsHistoryOpen(false); }} className="glass-panel !bg-white/70 rounded-2xl p-5 cursor-pointer hover:bg-white transition group border border-white shadow-sm relative overflow-hidden">
                                                
                                                <div className={`absolute top-0 left-0 w-1.5 h-full ${status==='waiting' ? 'bg-gray-400' : status==='cooking' ? 'bg-foodies-yellow' : 'bg-green-500'}`}></div>

                                                <div className="flex justify-between items-center mb-3 pl-2">
                                                    <div className="flex items-center space-x-2">
                                                        <span className="bg-black text-white text-xs font-black px-2 py-1 rounded shadow-sm">#{ticket.id}</span>
                                                        <span className="text-xs font-bold text-gray-500">{ticket.date}</span>
                                                    </div>
                                                    <button onClick={(e) => deleteReceipt(e, ticket)} className={`w-7 h-7 rounded-full flex items-center justify-center transition shadow-sm ${isDone ? 'bg-gray-100 hover:bg-red-500 hover:text-white text-gray-400' : 'bg-gray-200 text-gray-400 opacity-70'}`}>
                                                        <i className={`fas ${isDone ? 'fa-times text-xs' : 'fa-lock text-[10px]'}`}></i>
                                                    </button>
                                                </div>
                                                <p className="font-black text-black text-xl pl-2 mb-1">{ticket.name}</p>
                                                
                                                {ticket.items && ticket.items.length > 0 && (
                                                    <p className="text-xs font-bold text-gray-500 pl-2 mb-3 truncate">
                                                        {ticket.items.join(', ')}
                                                    </p>
                                                )}

                                                <div className="flex justify-between items-center pl-2">
                                                    <p className="font-black text-black text-lg">${ticket.total}</p>
                                                    <span className={`text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm border uppercase tracking-wider ${isDone ? 'bg-green-100 text-green-700 border-green-200' : 'bg-white text-gray-800 border-gray-100'}`}>
                                                        {status}
                                                    </span>
                                                </div>
                                            </div>
                                        )})
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Glass Modals - QR STATUS TICKET */}
                    {showQR && activeTicket && (
                        <div className="fixed inset-0 glass-panel-dark z-[80] flex items-center justify-center p-4 overflow-hidden">
                            <div className="glass-panel !bg-white/95 rounded-[2.5rem] w-full max-w-sm max-h-[90vh] flex flex-col shadow-2xl relative border border-white">
                                
                                <div className="flex justify-end p-5 shrink-0">
                                    <button onClick={() => setShowQR(false)} className="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center hover:bg-gray-200 transition text-gray-700 shadow-inner z-10">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto hide-scrollbar px-6 pb-8 text-center flex flex-col items-center">
                                    
                                    {activeStatus === 'collected' || activeStatus === 'completed' ? (
                                        <div className="py-6">
                                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md border border-green-200">
                                                <i className="fas fa-check-double text-green-500 text-3xl"></i>
                                            </div>
                                            <h2 className="text-3xl font-serif font-black text-green-500 mb-2">Order Complete!</h2>
                                            <p className="text-gray-600 font-bold mb-6">Enjoy your meal. Thank you for choosing Foodies.</p>
                                        </div>
                                    ) : (
                                        <>
                                            {activeStatus === 'waiting' && (
                                                <>
                                                    <h2 className="text-3xl font-serif font-black text-black mb-2 mt-2">Order Placed!</h2>
                                                    <p className="text-gray-600 font-bold mb-6">Scan this token at the counter for instant assembly.</p>
                                                </>
                                            )}
                                            {activeStatus === 'cooking' && (
                                                <>
                                                    <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mt-2 mb-4 shadow-md border border-gray-100">
                                                        <i className="fas fa-fire text-foodies-yellow animate-pulse text-2xl"></i>
                                                    </div>
                                                    <h2 className="text-3xl font-serif font-black text-black mb-2">Cooking!</h2>
                                                    <p className="text-gray-600 font-bold mb-6">Your order is being prepared in the kitchen.</p>
                                                </>
                                            )}
                                            {activeStatus === 'ready' && (
                                                <>
                                                    <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mt-2 mb-4 shadow-md border border-gray-100">
                                                        <i className="fas fa-check text-green-500 text-2xl"></i>
                                                    </div>
                                                    <h2 className="text-3xl font-serif font-black text-green-500 mb-2">Ready to Collect!</h2>
                                                    <p className="text-gray-600 font-bold mb-6">Scan this QR at the Dispatch counter.</p>
                                                </>
                                            )}
                                            
                                            <div className="bg-white p-5 rounded-[2rem] border border-gray-100 mb-6 inline-block shadow-lg">
                                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&ecc=H&data=${encodeURIComponent(activeTicket.payload)}&color=000000&bgcolor=FFFFFF`} className="w-48 h-48" />
                                            </div>
                                        </>
                                    )}

                                    <div className="glass-panel !bg-gray-50 rounded-2xl p-5 w-full text-left border border-gray-200 shadow-inner mt-auto shrink-0">
                                        <p className="font-bold text-gray-600 text-sm mb-1">Order ID: <span className="text-black text-lg">#{activeTicket.id}</span></p>
                                        <p className="font-bold text-gray-600 text-sm mb-3">Name: <span className="text-black">{activeTicket.name}</span></p>
                                        
                                        {activeTicket.items && activeTicket.items.length > 0 && (
                                            <div className="border-t border-gray-200 pt-3 mb-3">
                                                <p className="font-bold text-gray-500 text-xs mb-2 uppercase tracking-wider">Order Items</p>
                                                <ul className="space-y-1">
                                                    {activeTicket.items.map((item, i) => (
                                                        <li key={i} className="text-sm font-bold text-black flex items-start">
                                                            <span className="text-foodies-yellow mr-2">•</span> {item}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        <div className="border-t border-gray-200 pt-3 flex justify-between items-center">
                                            <span className="font-bold text-gray-600">Paid Total</span>
                                            <span className="font-black text-xl text-black">${activeTicket.total}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
